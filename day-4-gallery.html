<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery · Northline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --max: 72rem;
      --line: #d0d0d0;
      --text: #1a1a1a;
      --muted: #5f5f5f;
    }
    body {
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }
    img { max-width: 100%; height: auto; }
    a { color: #111; }
    a:hover { color: #333; }
    .wrap { width: min(var(--max), calc(100% - 2rem)); margin-inline: auto; }
    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .site-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4rem;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .logo-mark { width: 0.7rem; height: 0.7rem; background: #000; flex: 0 0 auto; }
    .site-header nav ul {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .site-header nav a { color: var(--text); text-decoration: none; }
    .site-header nav a:hover, .site-header nav a[aria-current="page"] { text-decoration: underline; }
    main { padding: 2.5rem 0 3rem; }
    .kicker {
      margin: 0 0 0.5rem;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.2;
    }
    .lede { max-width: 42rem; margin-top: 0; color: var(--muted); font-size: 1.05rem; }
    .gallery {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1.75rem 0 0;
      padding: 0;
    }
    .gallery figure {
      margin: 0;
      background: transparent;
      border: 1px solid var(--line);
      padding: 0.5rem;
    }
    .gallery img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #f2f2f2;
    }
    figcaption {
      padding: 0.7rem 0.1rem 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 1.25rem 0 2rem;
      color: var(--muted);
    }
    .site-footer .wrap {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .site-footer p { margin: 0; }
    @media (max-width: 800px) {
      .gallery { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      main { padding-top: 2rem; }
      .site-header .wrap { flex-direction: column; align-items: flex-start; padding: 0.9rem 0; min-height: 0; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true"></span>
        Northline
      </a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="day-5-blog-post.html">Journal</a></li>
          <li><a href="day-4-gallery.html" aria-current="page">Gallery</a></li>
          <li><a href="day-1-five-tags.html">Notes</a></li>
          <li><a href="day-3-contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="kicker">Day 4</p>
    <h1>Studio week</h1>
    <p class="lede">Six photographs from the studio archive, each framed with a short note from the day.</p>

    <ul class="gallery">
      <li>
        <figure>
          <img src="images/alexanderschimmeck-unsplash.jpg" width="800" height="600" alt="Dark pier and blue water at sunset">
          <figcaption>Harbor pier, late afternoon</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="images/pixie.jpg" width="800" height="600" alt="Close portrait with warm studio light">
          <figcaption>Desk before the first email</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="images/jimmy%20unsplash.jpg" width="800" height="600" alt="Notebook and writing desk in natural light">
          <figcaption>Field notebook, page 40</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="images/stephan-bechert%20unsplash.jpg" width="800" height="600" alt="Lighthouse and evening sky over the coast">
          <figcaption>Light on the breakwater</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="images/anthonydelanoix%20unsplash.jpg" width="800" height="600" alt="Textured paper and layered material samples">
          <figcaption>Paper stock samples</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="images/alexanderschimmeck-unsplash.jpg" width="800" height="600" alt="Another view of the harbor at dusk">
          <figcaption>Studio window in March</figcaption>
        </figure>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Northline · Daily Challenges</p>
      <p><a href="index.html">All days</a></p>
    </div>
  </footer>
</body>
</html>
