<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>
    <main>
        <h1>Contact Me</h1>
        <p>Fields marked with <span aria-hidden="true">*</span> are required.</p>

        <!-- Replace YOUR_FORM_ID with the ID from your Formspree form endpoint -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

            <fieldset>
                <legend>Your Details</legend>

                <p>
                    <label for="full-name">Full Name <span aria-hidden="true">*</span></label><br>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        placeholder="e.g. Good Day"
                        autocomplete="name"
                        required>
                </p>

                <p>
                    <label for="email">Email <span aria-hidden="true">*</span></label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. goodday@example.com"
                        autocomplete="email"
                        required>
                </p>

                <p>
                    <label for="phone">Phone (optional)</label><br>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. +254 700 000000"
                        autocomplete="tel">
                </p>
            </fieldset>

            <fieldset>
                <legend>Your Message</legend>

                <p>
                    <label for="subject">Subject</label><br>
                    <select id="subject" name="subject">
                        <option value="general">General inquiry</option>
                        <option value="support">Support</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message <span aria-hidden="true">*</span></label><br>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        minlength="50"
                        placeholder="Write your message here (at least 50 characters)"
                        aria-describedby="message-hint"
                        required></textarea>
                    <br>
                    <small id="message-hint">Minimum 50 characters.</small>
                </p>
            </fieldset>

            <fieldset>
                <legend>Preferences</legend>

                <p>
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    <label for="newsletter">Subscribe to the newsletter</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Send Message</button>
            </p>

        </form>
    </main>
</body>
</html>
