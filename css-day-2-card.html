        <h1>Card Component</h1>
        <p>A reusable card with an image, description, categories, and a call to action.</p>
        <article class="demo-card">
            <img src="images/alexanderschimmeck-unsplash.jpg" alt="Pier and blue water at sunset">
            <div class="demo-card-content">
                <h2>Harbor at Sunset</h2>
                <p>A quiet evening by the water, captured during a walk along the coast.</p>
                <ul class="demo-card-tags" aria-label="Categories">
                    <li>Photography</li>
                    <li>Coast</li>
                    <li>Travel</li>
                </ul>
                <a class="demo-button demo-button-primary" href="day-4-gallery.html">Explore the gallery</a>
